name: Autopopulate contribution graph

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  populate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Autopopulate your contribution graph
        uses: bcanseco/github-contribution-graph-action@2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
